name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate release keystore
        run: keytool -genkeypair -v -keystore app/release.keystore -alias nekospeak -keyalg RSA -keysize 2048 -validity 10000 -storepass nekospeak123 -keypass nekospeak123 -dname "CN=NekoSpeak, O=NekoSpeak, C=US"
      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nekospeak-fixed-apks
          path: app/build/outputs/apk/release/*.apk
